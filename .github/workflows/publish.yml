name: publish

# Publishes the npm package when a v* tag is pushed. The tag IS the version:
# v0.1.2 publishes @bare-metal-cloud/client@0.1.2 regardless of what
# package.json carried (regeneration keeps a running version; the tag wins).
#
# Auth model: npm credential via the NPM_TOKEN secret (automation token for
# the bare-metal-cloud npm org). npm's OIDC trusted publishing would remove
# the token, but it only works on GitHub-hosted runners and this org runs
# everything on its own fleet (namespace-profile-bmc) — so the workflow
# still attempts OIDC first and falls back to the token. If npm ever
# supports self-hosted runners for OIDC, the fleet job starts publishing
# token-free automatically.

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC), when npm learns self-hosted

jobs:
  publish-npm:
    runs-on: namespace-profile-bmc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Build
        run: |
          npm install -g npm@^11.5.1 # trusted publishing needs npm 11.5.1+
          npm install --no-audit --no-fund
          npm run build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "false" # npm auto-attaches provenance in Actions; npm rejects self-hosted provenance, and this job runs on the org fleet
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          echo "publishing version $ver (from tag $GITHUB_REF_NAME)"
          npm version "$ver" --no-git-tag-version --allow-same-version
          npm pkg set repository.type=git \
            repository.url=git+https://github.com/bare-metal-cloud/client-js.git
          if env -u NODE_AUTH_TOKEN npm publish --access public; then
            echo "published via OIDC trusted publishing"
          elif [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "OIDC publish rejected; retrying with the NPM_TOKEN fallback"
            npm publish --access public
          else
            echo "::error::npm publish failed and no NPM_TOKEN fallback is set. If the package exists on npmjs, attach its trusted publisher (GitHub: bare-metal-cloud/client-js, workflow publish.yml). Until then, bootstrap with an automation token."
            exit 1
          fi
