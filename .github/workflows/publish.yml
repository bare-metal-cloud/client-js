name: publish

# Publishes the npm package when a v* tag is pushed. The tag IS the version:
# v0.1.2 publishes @bare-metal-cloud/client@0.1.2 regardless of what
# package.json carried (regeneration keeps a running version; the tag wins).
#
# Auth model: npm trusted publishing (OIDC) — the package on npmjs.com lists
# this repo + workflow as its trusted publisher, so no npm credential lives
# in GitHub. Requires a GitHub-hosted runner (self-hosted is not supported
# by npm OIDC yet) and npm 11.5.1+, installed in-line below. The NPM_TOKEN
# secret is only a fallback for the bootstrap case (a package that exists
# but has no trusted-publisher attachment yet); if the token is absent too,
# the job fails loudly instead of pretending.

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish-npm:
    runs-on: ubuntu-latest # npm OIDC does not work on self-hosted runners
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Build
        run: |
          npm install -g npm@^11.5.1 # trusted publishing needs npm 11.5.1+
          npm install --no-audit --no-fund
          npm run build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          echo "publishing version $ver (from tag $GITHUB_REF_NAME)"
          npm version "$ver" --no-git-tag-version --allow-same-version
          npm pkg set repository.type=git \
            repository.url=git+https://github.com/bare-metal-cloud/client-js.git
          if env -u NODE_AUTH_TOKEN npm publish --access public; then
            echo "published via OIDC trusted publishing"
          elif [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "OIDC publish rejected; retrying with the NPM_TOKEN fallback"
            npm publish --access public
          else
            echo "::error::npm publish failed and no NPM_TOKEN fallback is set. If the package exists on npmjs, attach its trusted publisher (GitHub: bare-metal-cloud/client-js, workflow publish.yml). Until then, bootstrap with an automation token."
            exit 1
          fi
